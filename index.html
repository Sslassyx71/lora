#outer{display:flex;justify-content:center}
#stage{width:352px;transform-origin:top center}
#app{background:#2a0712;border-radius:16px;padding:12px 6px 14px;color:#f6e7e1;font-family:'Cormorant Garamond',serif}
#app button{font-family:'Cormorant Garamond',serif;color:#e8c4b8;background:transparent;border:0.5px solid #e8c4b8;border-radius:999px;font-size:17px;padding:9px 20px;cursor:pointer}
.ms{font-family:'Marck Script',cursive}
.px{font-family:'Press Start 2P',monospace}
#wrap{position:relative;width:340px;height:520px;margin:0 auto;overflow:hidden;border-radius:12px}
#cv{display:block;width:340px;height:520px;cursor:pointer;touch-action:manipulation}
#hud{display:flex;gap:5px;width:340px;margin:0 auto 8px}
.q{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:32px;border:0.5px solid #5e1427;border-radius:8px;color:#b98a80;font-size:15px;transition:all .4s}
.q.done{border-color:#e8b4a6;color:#f6e7e1;background:#4a0f1f}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;background:#f6e7e1;color:#4a0f1f;border-radius:10px;padding:10px 14px 18px;font-size:18px;line-height:1.3;display:none;cursor:pointer;z-index:4}
#bub{position:absolute;display:none;background:#f6e7e1;color:#4a0f1f;font-size:15px;padding:4px 10px;border-radius:10px;white-space:nowrap;z-index:3;pointer-events:none}
#choice{position:absolute;left:8px;right:8px;bottom:14px;display:none;gap:10px;justify-content:center;z-index:5}
#app #choice button{background:#f6e7e1;color:#4a0f1f;border:0;font-size:19px;padding:10px 24px}
#ov,#fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box;z-index:6}
#ov{background:rgba(26,4,10,.95)}
#fade{position:absolute;inset:0;background:#120208;opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#app .key{width:58px;height:46px;border-radius:10px;padding:0;font-size:14px;font-family:'Press Start 2P',monospace}
#app .cnd{width:24px;height:56px;padding:0;border:0;border-radius:0;background:transparent;position:relative}
.cnd .st{position:absolute;left:9px;bottom:0;width:6px;height:36px;background:#f6e7e1}
.cnd:nth-child(odd) .st{background:#ed93b1}
.cnd .fl{position:absolute;left:7px;top:2px;width:10px;height:15px;background:#ffcf7a;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;animation:fl .25s infinite alternate;transform-origin:50% 100%}
.cnd.out .fl{display:none}
.cnd.out::after{content:'';position:absolute;left:9px;top:8px;width:6px;height:6px;border-radius:50%;background:#b98a80;animation:smoke 1.2s forwards}
.flap{position:absolute;top:0;left:0;width:0;height:0;border-left:120px solid transparent;border-right:120px solid transparent;border-top:92px solid #5e1427;transform-origin:top;transition:transform .8s}

@keyframes smoke{to{transform:translateY(-30px) scale(2);opacity:0}}
@keyframes rise{to{transform:translateY(-680px)}}
@keyframes pulse{50%{opacity:.4}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes tw{50%{opacity:.15}}
